<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Glint Docs</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    name="description"
    content="Glint documentation - turn real app UI into Play Store and App Store screenshots."
  />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <style>
    :root {
      --theme-color: #b8941f;
      --glint-ink: #1a1c1f;
      --glint-muted: #5c6370;
      --glint-line: #e8eaed;
      --glint-side: #f7f6f3;
      --glint-accent: #c9a227;
    }

    html, body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--glint-ink);
      overflow-x: hidden;
      max-width: 100%;
    }

    /* Docsify uses width:100vw on main - that causes horizontal scroll */
    main {
      width: 100% !important;
      max-width: 100%;
    }

    /* Reading column */
    .content {
      padding-top: 24px;
      max-width: 100%;
      box-sizing: border-box;
    }
    .markdown-section {
      max-width: 740px;
      padding: 28px 36px 64px;
      line-height: 1.65;
      font-size: 16px;
      overflow-wrap: anywhere;
      word-break: break-word;
      box-sizing: border-box;
    }
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3 {
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    .markdown-section h1 { margin-top: 0; }
    .markdown-section h2 {
      margin-top: 2rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--glint-line);
    }
    .markdown-section p,
    .markdown-section li {
      color: #2a2e35;
    }
    .markdown-section code {
      background: #f3f1ea;
      color: #5a4a12;
      padding: 0.12em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .markdown-section pre {
      border-radius: 10px;
      border: 1px solid var(--glint-line);
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-section pre > code {
      white-space: pre;
      word-break: normal;
    }
    .markdown-section table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-section img {
      max-width: 100%;
      height: auto;
    }
    .markdown-section tr:nth-child(2n) {
      background-color: #faf9f6;
    }

    /* Sidebar shell */
    .sidebar {
      background: var(--glint-side);
      border-right: 1px solid var(--glint-line);
      padding-top: 0 !important;
    }
    .sidebar .glint-side-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--glint-line);
      position: sticky;
      top: 0;
      background: var(--glint-side);
      z-index: 2;
    }
    .sidebar .app-name {
      margin: 0 !important;
      padding: 0 !important;
      flex: 1;
      min-width: 0;
    }
    .sidebar .app-name a {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--glint-ink) !important;
      text-decoration: none;
    }
    .sidebar .app-name-link::before,
    .sidebar .app-name-link img {
      display: none !important;
    }

    .glint-side-toggle {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: 1px solid var(--glint-line);
      border-radius: 8px;
      background: #fff;
      color: var(--glint-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .glint-side-toggle:hover {
      border-color: var(--glint-accent);
      color: var(--glint-ink);
      background: #fffdf5;
    }
    .glint-side-toggle svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    /* Search under title row */
    .sidebar .search {
      margin: 12px 12px 8px !important;
      padding: 0 !important;
      border-bottom: none !important;
    }
    .sidebar .search .input-wrap {
      border: 1px solid var(--glint-line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .sidebar .search input {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      padding: 10px 12px !important;
      font-size: 13px;
    }
    .sidebar .search input:focus {
      outline: none;
    }
    .sidebar .search .clear-button {
      display: none !important;
    }

    .sidebar-nav {
      padding: 4px 8px 28px !important;
    }
    .sidebar-nav ul {
      margin: 0;
      padding-left: 0 !important;
      list-style: none;
    }
    /* Section labels (Start, Modes, Ship, Reference) - same column as Home */
    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > strong {
      display: block;
      margin: 14px 0 6px;
      padding: 0 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--glint-muted);
    }
    /* Top-level pages (Home) */
    .sidebar-nav > ul > li > a {
      border-radius: 8px;
      padding: 7px 10px !important;
      color: #3a3f48 !important;
      font-size: 13.5px;
      line-height: 1.35;
    }
    /* Nested page titles under a section - indented */
    .sidebar-nav > ul > li > ul > li > a {
      border-radius: 8px;
      padding: 7px 10px 7px 22px !important;
      color: #3a3f48 !important;
      font-size: 13.5px;
      line-height: 1.35;
    }
    /* In-page headings (subtitles) - one more step in */
    .sidebar-nav > ul > li > ul > li > ul > li > a {
      padding: 5px 10px 5px 34px !important;
      font-size: 12.5px;
      color: var(--glint-muted) !important;
    }
    .sidebar-nav li a:hover {
      background: #efece4;
      text-decoration: none !important;
    }
    .sidebar-nav li.active > a {
      background: #f3ead0;
      color: #5a4708 !important;
      font-weight: 600;
      border-right: none;
    }

    /* Hide stock hamburger (we use .glint-open-side + header toggle) */
    .sidebar-toggle {
      display: none !important;
    }

    /* Floating menu control - visibility driven by [hidden] + JS
       Docsify quirk: body.close means "collapsed" on desktop, "drawer open" on mobile */
    .glint-open-side {
      display: inline-flex;
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 50;
      align-items: center;
      gap: 8px;
      height: 36px;
      padding: 0 12px 0 10px;
      border: 1px solid var(--glint-line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      color: var(--glint-ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .glint-open-side[hidden] {
      display: none !important;
    }
    .glint-open-side svg {
      width: 16px;
      height: 16px;
    }

    .glint-side-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 35;
      background: rgba(26, 28, 31, 0.35);
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    .glint-side-backdrop.is-on {
      display: block;
    }

    /* Aesthetic scrollbars */
    * {
      scrollbar-width: thin;
      scrollbar-color: #d4c48a #f0eee8;
    }
    *::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }
    *::-webkit-scrollbar-track {
      background: #f0eee8;
    }
    *::-webkit-scrollbar-thumb {
      background: #d4c48a;
      border-radius: 999px;
      border: 2px solid #f0eee8;
    }
    *::-webkit-scrollbar-thumb:hover {
      background: var(--glint-accent);
    }

    @media screen and (max-width: 768px) {
      .markdown-section {
        padding: 56px 16px 48px;
        font-size: 15.5px;
        max-width: 100%;
      }
      .content {
        left: 0 !important;
        position: relative !important;
        padding-top: 8px !important;
        max-width: 100%;
        overflow-x: hidden;
        transform: none !important;
      }
      /* Keep reading pane still while the drawer overlays it */
      body.close .content,
      body.close .app-nav,
      body.close .github-corner {
        transform: none !important;
      }

      /*
        Own the mobile drawer: park at left:0 and slide with transform.
        Docsify's left:-300px + translateX(300px) is easy to break / clip.
      */
      main {
        z-index: auto !important;
        overflow: visible !important;
      }
      .sidebar {
        position: fixed !important;
        top: 0 !important;
        bottom: 0 !important;
        left: 0 !important;
        width: min(300px, 86vw) !important;
        height: 100% !important;
        max-height: 100dvh;
        padding-top: 0 !important;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        z-index: 40 !important;
        background: var(--glint-side);
        box-shadow: 8px 0 32px rgba(0, 0, 0, 0.18);
        transform: translate3d(-105%, 0, 0) !important;
        transition: transform 0.25s ease-out !important;
        will-change: transform;
      }
      body.close .sidebar {
        transform: translate3d(0, 0, 0) !important;
      }

      .glint-side-backdrop {
        z-index: 35;
      }
      .glint-open-side {
        top: max(12px, env(safe-area-inset-top));
        left: max(12px, env(safe-area-inset-left));
      }
      .github-corner svg {
        width: 56px !important;
        height: 56px !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <button type="button" class="glint-side-backdrop" aria-label="Close docs menu" tabindex="-1"></button>
  <button type="button" class="glint-open-side" aria-label="Open docs menu" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
    Docs
  </button>
  <script>
    var basePath = /^\/Glint-Docs(\/|$)/.test(location.pathname)
      ? '/Glint-Docs/'
      : '/';

    var CHEVRON_LEFT =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
    var CHEVRON_RIGHT =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';

    function isMobileNav() {
      return window.matchMedia('(max-width: 768px)').matches;
    }

    /** true when the nav panel is not on screen */
    function navHidden() {
      var closed = document.body.classList.contains('close');
      // Desktop: close = collapsed. Mobile: close = drawer open.
      return isMobileNav() ? !closed : closed;
    }

    function syncToggleUi() {
      var hidden = navHidden();
      var mobile = isMobileNav();
      var btn = document.querySelector('.glint-side-toggle');
      var openBtn = document.querySelector('.glint-open-side');
      var backdrop = document.querySelector('.glint-side-backdrop');

      if (btn) {
        btn.innerHTML = hidden ? CHEVRON_RIGHT : CHEVRON_LEFT;
        btn.setAttribute('aria-label', hidden ? 'Open sidebar' : 'Close sidebar');
        btn.title = hidden ? 'Open' : 'Close';
      }
      if (openBtn) {
        openBtn.hidden = !hidden;
      }
      if (backdrop) {
        backdrop.classList.toggle('is-on', mobile && !hidden);
      }
      document.body.style.overflow = mobile && !hidden ? 'hidden' : '';
    }

    function toggleSidebar() {
      document.body.classList.toggle('close');
      syncToggleUi();
    }

    function closeMobileNav() {
      if (!isMobileNav()) return;
      if (document.body.classList.contains('close')) {
        document.body.classList.remove('close');
        syncToggleUi();
      }
    }

    window.$docsify = {
      name: 'Glint Docs',
      repo: 'https://github.com/GlintShot/Glint-Docs',
      homepage: 'README.md',
      basePath: basePath,
      loadSidebar: true,
      autoHeader: false,
      subMaxLevel: 0,
      auto2top: true,
      relativePath: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      notFoundPage: true,
      search: {
        placeholder: 'Search docs',
        noData: 'No results',
      },
      plugins: [
        function (hook) {
          hook.ready(function () {
            var sidebar = document.querySelector('.sidebar');
            if (!sidebar) return;

            var nameEl = sidebar.querySelector('.app-name');
            var searchEl = sidebar.querySelector('.search');

            var header = document.createElement('div');
            header.className = 'glint-side-header';

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'glint-side-toggle';
            btn.addEventListener('click', toggleSidebar);

            if (nameEl) header.appendChild(nameEl);
            header.appendChild(btn);
            sidebar.insertBefore(header, sidebar.firstChild);

            if (searchEl) {
              sidebar.insertBefore(searchEl, header.nextSibling);
            }

            var openBtn = document.querySelector('.glint-open-side');
            if (openBtn) {
              openBtn.addEventListener('click', toggleSidebar);
            }

            var backdrop = document.querySelector('.glint-side-backdrop');
            if (backdrop) {
              backdrop.addEventListener('click', closeMobileNav);
            }

            sidebar.addEventListener('click', function (e) {
              var a = e.target.closest && e.target.closest('a');
              if (a) closeMobileNav();
            });

            window.addEventListener('resize', syncToggleUi);
            syncToggleUi();
          });

          hook.doneEach(function () {
            closeMobileNav();
            syncToggleUi();
          });
        },
      ],
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
